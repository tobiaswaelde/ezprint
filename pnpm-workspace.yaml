packages:
  - '.'
  - 'docker/prisma-runtime'

minimumReleaseAgeExclude:
  - '@querry-kit/nuxt-ui@3.3.10'
  - '@querry-kit/nuxt@0.2.10'
  - '@node-rs/argon2-android-arm-eabi@2.2.1'
  - '@node-rs/argon2-android-arm64@2.2.1'
  - '@node-rs/argon2-darwin-arm64@2.2.1'
  - '@node-rs/argon2-darwin-x64@2.2.1'
  - '@node-rs/argon2-freebsd-x64@2.2.1'
  - '@node-rs/argon2-linux-arm-gnueabihf@2.2.1'
  - '@node-rs/argon2-linux-arm64-gnu@2.2.1'
  - '@node-rs/argon2-linux-arm64-musl@2.2.1'
  - '@node-rs/argon2-linux-x64-gnu@2.2.1'
  - '@node-rs/argon2-linux-x64-musl@2.2.1'
  - '@node-rs/argon2-win32-arm64-msvc@2.2.1'
  - '@node-rs/argon2-win32-ia32-msvc@2.2.1'
  - '@node-rs/argon2-win32-x64-msvc@2.2.1'
  - '@node-rs/argon2@2.2.1'
  - zod@4.6.1
  - happy-dom@20.14.3
  - '@querry-kit/nuxt-ui@3.3.2'
  - '@querry-kit/nuxt@0.2.4'
  - '@querry-kit/nuxt@0.2.9'
  - '@querry-kit/nuxt-ui@3.3.9'

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true
overrides:
  vitepress>vite: 6.4.5
  esbuild@>=0.27.3 <0.28.1: 0.28.2

# VitePress 1 uses DocSearch 3, whose supported React host remains React 18.
# Isolate that host instead of binding it to Prisma's optional React 19 peers.
packageExtensions:
  '@docsearch/react@3.8.2':
    dependencies:
      react: 18.3.1
      react-dom: 18.3.1
      '@types/react': 18.3.31
